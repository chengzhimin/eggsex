[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eggsex-hsi"
version = "0.1.0"
description = "Research baseline for paired transmission images and hyperspectral classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2,<3", "scikit-learn>=1.6,<1.9", "opencv-python-headless>=4.8,<5", "joblib>=1.3,<2", "spectral>=0.23,<0.25"]

[project.scripts]
eggsex = "eggsex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
